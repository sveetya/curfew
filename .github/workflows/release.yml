name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and format check (Biome)
        run: pnpm lint

      - name: Typecheck (TypeScript 7)
        run: pnpm exec tsc -p tsconfig.json --noEmit

      - name: Frontend tests
        run: pnpm test

      - name: Clippy
        run: cargo clippy -p curfew-core --all-targets -- -D warnings

      - name: Core tests
        run: cargo test -p curfew-core

      - name: Build, sign and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CURFEW_RELEASE_HASH: ${{ secrets.CURFEW_RELEASE_HASH }}
        with:
          tagName: v__VERSION__
          releaseName: "Curfew v__VERSION__"
          releaseBody: "Signed Windows build. The updater verifies the manifest hash before installing."
          releaseDraft: false
          prerelease: false
