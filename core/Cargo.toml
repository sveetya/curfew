[package]
name = "curfew-core"
version = "0.2.0"
description = "Curfew state machine, scheduler arguments and audit log — no UI, no Windows"
edition = "2021"
rust-version = "1.77"

[dependencies]
chrono = { version = "0.4", features = ["serde", "clock"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
